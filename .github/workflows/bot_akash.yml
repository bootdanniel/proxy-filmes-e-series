name: Akash Proxy Bot
on:
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node bot.js
        env:
          AKASH_API_KEYS: ${{ secrets.AKASH_API_KEYS }}
